name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://postgres:secret@localhost:5432/drizzle_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - name: Pull Postgres (with retries and a fallback registry)
        run: |
          # Amazon's public registry first, Docker Hub as a fallback; either way the image
          # ends up under the name the tests use.
          IMG=public.ecr.aws/docker/library/postgres:16-alpine
          for i in 1 2 3 4; do
            for src in $IMG postgres:16-alpine; do
              docker pull "$src" && docker tag "$src" "$IMG" && exit 0
            done
            echo "pull failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=drizzle_test public.ecr.aws/docker/library/postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -h 127.0.0.1 -U postgres && exit 0; sleep 2; done
          docker logs pg; exit 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t drizzle .
